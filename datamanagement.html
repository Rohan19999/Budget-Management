    <script>
   function updateTime(){
    const now = new Date();
    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    const timeEl = document.getElementById("time");
    if(timeEl){
        timeEl.innerText = `${h}:${m}:${s}`;
    }

    const dateEl = document.getElementById("todayDate");
    if(dateEl){
        dateEl.innerText =
            now.toLocaleDateString('en-IN',{
                day:'numeric',
                month:'long',
                year:'numeric'
            }).toUpperCase();
    }
}

// MISSING (MAIN FIX)
updateTime();
setInterval(updateTime, 1000);

   function loadCalendar(){
    const monthTitle = document.getElementById("monthTitle");
    const calendar = document.getElementById("calendar");

    // IMPORTANT: prevent crash if elements don't exist
    if(!monthTitle || !calendar) return;

    const now = new Date();
    const month = now.getMonth();
    const year = now.getFullYear();
    const today = now.getDate();

    const firstDay = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();

    const months = [
        "JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE",
        "JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"
    ];

    monthTitle.innerText = `${months[month]} ${year}`;

    let html = "";

    for(let i = 0; i < firstDay; i++){
        html += `<div></div>`;
    }

    for(let d = 1; d <= days; d++){
        const isToday = (d === today);
        html += `
            <div style="
                text-align:center;
                font-size:10px;
                padding:3px 0;
                font-family:'JetBrains Mono', monospace;
                ${isToday ? 'background:#0284c7;color:white;font-weight:600;border-radius:2px;' : 'color:#94a3b8;'}
            ">
                ${d}
            </div>
        `;
    }

    calendar.innerHTML = html;
}
    </script>

    <script src="config.js"></script>
    <script>
    (function(){
      const auth = JSON.parse(localStorage.getItem("financeAuth") || "null");
      if(!auth || !auth.username || !auth.role){
        window.location.replace("login.html");
        return;
      }

      const role = auth.role;
      const label = document.getElementById("welcomeLabel");
      if(label){
        label.innerHTML = ` Welcome, <strong>${role.toUpperCase()}</strong>`;
      }
      
      const initialBox = document.getElementById("userInitial");
      if(initialBox && auth.username) {
          initialBox.innerText = auth.username.charAt(0).toUpperCase();
      }

      // Populate sidebar user profile
      const nameElem = document.getElementById("sidebarUserName");
      const roleElem = document.getElementById("sidebarUserRole");
      const avatarElem = document.getElementById("sidebarAvatar");
      if(nameElem && auth.username) {
          nameElem.innerText = auth.fullName || auth.username;
      }
      if(roleElem && auth.role) {
          roleElem.innerText = auth.role;
      }
      if(avatarElem && auth.username) {
          avatarElem.innerText = auth.username.charAt(0).toUpperCase();
      }

      // Bind logout button
      const logoutBtn = document.getElementById("sidebarLogoutBtn");
      if(logoutBtn) {
          logoutBtn.addEventListener("click", () => {
              localStorage.removeItem("financeAuth");
              window.location.href = "login.html";
          });
      }

      const tabFrame = document.getElementById("tabContentFrame");
      const financeHubTabs = document.querySelectorAll("#financeHubTabs .nav-sub-item");
      const viewDataTab = document.querySelector('a.nav-sub-item[href="viewdata.html"]');

      if (role === "Account Team") {
        financeHubTabs.forEach((tab) => {
          const isViewDataTab = tab.getAttribute("href") === "viewdata.html";
          tab.classList.toggle("nav-role-hidden", !isViewDataTab);
          tab.classList.toggle("active", isViewDataTab);
        });
      } else {
        financeHubTabs.forEach((tab) => {
          tab.classList.remove("nav-role-hidden");
        });
      }

      if (typeof window.applyFinanceSidebarRoleVisibility === "function") {
        window.applyFinanceSidebarRoleVisibility();
      }

      if (tabFrame) {
        const requestedTab = new URLSearchParams(window.location.search).get("tab");
        const openViewData = requestedTab === "viewdata" && role !== "Account Team";
        tabFrame.src = role === "Account Team" || openViewData ? "viewdata.html" : "masterdata.html";
        if (openViewData && viewDataTab) {
          financeHubTabs.forEach((item) => item.classList.remove("active"));
          viewDataTab.classList.add("active");
        }
        tabFrame.addEventListener("load", () => {
          tabFrame.classList.remove("is-loading");
        });
      }

      if (role !== "Account Team" && viewDataTab) {
        viewDataTab.classList.remove("active");
      }

      financeHubTabs.forEach((tab) => {
        tab.addEventListener("click", (event) => {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.button !== 0) return;
          event.preventDefault();

          const targetSrc = tab.dataset.tabSrc || tab.getAttribute("href");
          if (!targetSrc || !tabFrame) return;

          financeHubTabs.forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");

          if (tabFrame.getAttribute("src") === targetSrc) return;
          tabFrame.classList.add("is-loading");
          window.setTimeout(() => {
            tabFrame.src = targetSrc;
          }, 120);
        });
      });
    })();
    </script>
     <script>
        function updateGreetingAndDate() {
            const now = new Date();
            const hour = now.getHours();
            let greeting = hour < 12 ? "Good Morning" : hour < 17 ? "Good Afternoon" : "Good Evening";
            let emoji = "";
            
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('greeting-date').innerText = `${emoji} ${greeting} | ${now.toLocaleDateString('en-GB', options)}`;
        }
        updateGreetingAndDate();
    </script>
    <script>
const themeBtn = document.getElementById("themeToggle");
const body = document.body;
const icon = themeBtn.querySelector("i");
const text = themeBtn.querySelector(".toggle-text");

// Load saved theme
const savedTheme = localStorage.getItem("theme");

if(savedTheme === "dark"){
    body.classList.add("dark-mode");
    icon.className = "fa-solid fa-sun";
    text.innerText = "Light";
}

themeBtn.addEventListener("click", () => {

    body.classList.toggle("dark-mode");

    if(body.classList.contains("dark-mode")){
        icon.className = "fa-solid fa-sun";
        text.innerText = "Light";
        localStorage.setItem("theme","dark");
    }else{
        icon.className = "fa-solid fa-moon";
        text.innerText = "Dark";
        localStorage.setItem("theme","light");
    }

});
</script>
